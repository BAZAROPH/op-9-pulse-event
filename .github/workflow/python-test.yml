name: Python CI

on:
  push:
    branches: [main, features, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-mock pytest-cov

    - name: Run tests with coverage
      run: |
        # On lance les tests même si le dossier src est vide pour l'instant
        pytest --cov=src --cov-report=term-missing || echo "Pas encore de tests"